<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built for Balance</title>
<meta name="description" content="Built for Balance helps students notice and manage burnout.">
<style>
  :root { --bg:#ffffff; --text:#1c2433; --muted:#566074; --navy:#14284b; --steel:#3d6291; --line:#d9e0ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1624; --text:#e6ebf3; --muted:#a3adbf; --navy:#9fbbe3; --steel:#8fb0dd; --line:#273248; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { color:var(--navy); font-size:2.2rem; line-height:1.15; margin:0 0 .6rem; }
  p { max-width: 36rem; }
  ul { list-style:none; padding:0; margin:2rem 0 0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  li a { display:block; padding:1rem 0; color:var(--steel); font-weight:600; text-decoration:none; }
  li a:hover, li a:focus-visible { text-decoration:underline; outline:none; }
  li span { display:block; color:var(--muted); font-weight:400; font-size:.95rem; }
</style>
</head>
<body>
<main>
<h1>Built for Balance</h1>
<p>A free app from Built for Balance Foundation that helps students notice and manage burnout.</p>
<ul>
  <li><a href="privacy.html">Privacy Policy<span>How the app handles your information.</span></a></li>
  <li><a href="support.html">Support<span>Get help, delete your account, or report a problem.</span></a></li>
</ul>
</main>
</body>
</html>
